<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạp Hóa Diệc Ngân - Đăng Nhập</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#1a56db',
            heading: '#111827',
            body: '#4b5563',
          },
          borderRadius: {
            'large': '15px'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans antialiased">

  <!-- Quay lại trang chủ -->
  <div class="p-4">
    <a href="index.html" class="inline-flex items-center gap-2 text-gray-600 hover:text-[#00CCFF] font-semibold transition-colors">
      <i class="fas fa-arrow-left"></i> Quay lại trang chủ
    </a>
  </div>

  <!-- Container Đăng Nhập -->
  <main class="w-full max-w-md mx-auto p-4 flex-1 flex items-center justify-center">
    <div class="bg-white w-full p-8 rounded-2xl shadow-md border border-gray-100">
      
      <!-- Logo và Tiêu đề -->
      <div class="text-center mb-8">
        <div class="flex justify-center mb-3">
          <img src="image/DEK.webp" alt="Logo Diệc Ngân" class="rounded-large w-[140px] h-[70px] object-cover shadow-sm" onerror="this.src='https://via.placeholder.com/140x70?text=DIEC-NGAN'">
        </div>
        <h1 class="text-2xl font-bold text-heading">Chào mừng bạn trở lại!</h1>
        <p class="text-sm text-body mt-1">Đăng nhập để trải nghiệm mua sắm tuyệt vời hơn</p>
      </div>

      <!-- Form Đăng Nhập -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
        
        <!-- Tài khoản -->
        <div>
          <label for="username" class="block text-sm font-semibold text-gray-700 mb-1.5">Email hoặc Số điện thoại</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
              <i class="fas fa-user text-sm"></i>
            </div>
            <input type="text" id="username" required placeholder="Nhập email hoặc SĐT của bạn" 
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#00CCFF] focus:border-[#00CCFF] transition-all">
          </div>
        </div>

        <!-- Mật khẩu -->
        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Mật khẩu</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
              <i class="fas fa-lock text-sm"></i>
            </div>
            <input type="password" id="password" required placeholder="••••••••" 
              class="w-full pl-10 pr-10 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#00CCFF] focus:border-[#00CCFF] transition-all">
            <!-- Nút ẩn hiện mật khẩu -->
            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
              <i id="password-toggle-icon" class="fas fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <!-- Ghi nhớ & Quên mật khẩu -->
        <div class="flex items-center justify-between text-xs sm:text-sm">
          <label class="flex items-center gap-2 text-gray-600 cursor-pointer select-none">
            <input type="checkbox" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-gray-300">
            Nhớ đăng nhập
          </label>
          <a href="#" class="text-orange-600 font-medium hover:underline">Quên mật khẩu?</a>
        </div>

        <!-- Nút Đăng Nhập Chính -->
        <button type="submit" class="w-full py-3 bg-[#00CCFF] hover:bg-[#00bfff] text-heading font-bold rounded-xl shadow-sm hover:shadow transition-all flex items-center justify-center gap-2">
          ĐĂNG NHẬP <i class="fas fa-sign-in-alt"></i>
        </button>
      </form>

      <!-- Hoặc Đăng Nhập Bằng Cách Khác -->
      <div class="my-6 flex items-center justify-between">
        <span class="border-b w-1/5 border-gray-200"></span>
        <span class="text-xs text-gray-400 uppercase font-medium">Hoặc đăng nhập bằng</span>
        <span class="border-b w-1/5 border-gray-200"></span>
      </div>

      <!-- Các nút MXH -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="loginSocial('Google')" class="flex items-center justify-center gap-2 py-2.5 border border-gray-300 rounded-xl text-sm font-medium hover:bg-gray-50 transition-colors">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-4 h-4"> Google
        </button>
        <button onclick="loginSocial('Facebook')" class="flex items-center justify-center gap-2 py-2.5 border border-gray-300 rounded-xl text-sm font-medium hover:bg-gray-50 transition-colors">
          <i class="fab fa-facebook text-blue-600 text-base"></i> Facebook
        </button>
      </div>

      <!-- Chưa có tài khoản -->
      <p class="text-center text-sm text-gray-600 mt-8">
        Bạn chưa có tài khoản? <a href="dangky.html" class="text-blue-600 font-semibold hover:underline">Đăng ký ngay</a>
      </p>

    </div>
  </main>

  <!-- Footer thu gọn -->
  <footer class="py-4 text-center border-t border-gray-200 text-xs text-gray-400 bg-white">
    © 2026 TẠP HÓA DIỆC NGÂN - GIAO DIỆN ĐĂNG NHẬP
  </footer>

  <script>
    // Hàm ẩn/hiện mật khẩu
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('password-toggle-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    // Xử lý khi nhấn nút Đăng nhập
    function handleLogin(event) {
      event.preventDefault(); // Ngăn trang bị reload
      const user = document.getElementById('username').value;
      alert('Đang xử lý đăng nhập cho tài khoản: ' + user);
      // Khi có server, bạn sẽ xử lý gọi API kiểm tra ở đây
    }

    // Mô phỏng đăng nhập MXH
    function loginSocial(platform) {
      alert('Đang kết nối cổng đăng nhập bằng ' + platform);
    }
  </script>
</body>
</html>
